financial_analysis:
  description: >
    对股票 {company_stock} 进行全面的财务健康分析。使用A股财务报表查询工具和基本信息工具获取数据，
    重点分析以下指标：市盈率(PE)、每股收益(EPS)增长、营收趋势、资产负债率、净利润率、ROE等。
    同时对比同行业竞争对手，评估其市场地位。

  expected_output: >
    一份详细的财务分析报告，包含：
    1. 核心财务指标分析（PE、EPS、营收、利润）
    2. 资产负债结构评估
    3. 与行业均值对比
    4. 财务健康度综合评分

research:
  description: >
    收集并汇总股票 {company_stock} 的最新新闻、公告和市场动态。
    使用A股新闻公告查询工具获取近期资讯，重点关注重大事件、市场情绪、分析师观点、
    以及即将发生的事件（如业绩预告、分红等）。

  expected_output: >
    一份研究报告，包含：
    1. 最新重要新闻摘要
    2. 市场情绪判断
    3. 近期重大事件梳理
    4. 即将发生的重要事件
    股票代码：{company_stock}

filings_analysis:
  description: >
    分析股票 {company_stock} 的最新财务报告和公告披露内容。
    使用财务报表工具获取最新季报/年报数据，重点关注：
    管理层讨论与分析、财务报表关键变化、风险披露、以及内部人员持股变动。

  expected_output: >
    一份深度报告，包含：
    1. 最新财报关键数据解读
    2. 重要风险提示
    3. 管理层经营策略分析
    4. 值得关注的正面或负面信号

recommend:
  description: >
    综合财务分析师和研究分析师的分析结果，对股票 {company_stock} 给出完整的投资建议。
    需考虑财务健康状况、市场情绪、公告披露等多维度信息，
    并包含内部人员持股动态和近期重要事件。

  expected_output: >
    一份完整的投资建议报告，包含：
    1. 投资评级（买入/持有/卖出）及理由
    2. 目标价格区间
    3. 核心投资逻辑
    4. 主要风险提示
    5. 操作建议（短期/中期/长期）
    报告需格式清晰、数据充分、逻辑严谨。
